interface:
  display_name: "Feature Development Workflow"
  short_description: "Plan and build feature changes from small to complex"
  default_prompt: "Use $workflow-feature-development. Run $lean-grill-with-docs before plan writing, approval, implementation, or handoff. Do not proceed if the grill has not run. Then obtain approval, hand off to implementer and code-reviewer, record the required artifacts, and verify it."

policy:
  allow_implicit_invocation: false
